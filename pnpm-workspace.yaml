packages:
  - "apps/*"
  - "packages/*"

saveExact: true

# Build scripts stay off for these. They come in through testcontainers'
# Docker client (docker-modem -> ssh2) and the AWS SDK; none is needed: ssh2
# falls back to its JavaScript crypto, cpu-features is an optional speed-up for
# it, and protobufjs's postinstall only checks its own version.
allowBuilds:
  # core-js comes in through Docusaurus (apps/docs); its postinstall only
  # prints a funding message.
  core-js: false
  cpu-features: false
  protobufjs: false
  ssh2: false

# tough-cookie 6.1.0 (through msw and jsdom) takes tldts 7.4.19, whose
# tldts-core 7.4.20 npm marks deprecated: a partial release, with upstream
# asking for 7.4.22 or later (issue #176). Both are pinned to 7.5.2, the
# latest release, which passes pnpm's default minimumReleaseAge of 1440
# minutes (one day; the repo sets no age of its own).
#
# testcontainers 12.2.1 (the latest, a server devDependency) takes archiver
# 7.0.1, whose archiver-utils 5.0.2 asks for glob ^10; npm marks every glob
# 10 deprecated (issue #212). archiver-utils only calls glob.sync, in its
# file.expand, which neither archiver nor zip-stream uses, and glob 14 still
# exports sync. Scoped to archiver-utils so @fastify/static's glob, the one
# the app image ships, is left alone.
overrides:
  tldts: 7.5.2
  tldts-core: 7.5.2
  archiver-utils>glob: 14.0.6

  # The docs site (apps/docs, Docusaurus) pulls in three packages with known
  # advisories in their old releases (issue #432): tinypool 1.1.1 (prototype
  # pollution reaching worker options), serialize-javascript 6.0.2 (code
  # execution, CPU exhaustion and XSS) and uuid 8.3.2 (a missing buffer bounds
  # check). They run only when the site is built, never in the server, web app,
  # slicer or importer. The ranges are the first fixed releases and up; pnpm
  # resolves each to the newest release that passes its minimumReleaseAge.
  # "pnpm audit --prod --audit-level=critical" runs in CI (the lint job).
  tinypool: ">=2.1.2"
  serialize-javascript: ">=7.1.3"
  uuid: ">=11.1.1"
