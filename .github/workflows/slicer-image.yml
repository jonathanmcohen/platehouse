# Slicer image workflow: a daily check keeps the slicer image on the newest
# stable OrcaSlicer, publishing only after a smoke slice passes, and every image
# names the Orca version inside it so the app can re-estimate when it changes.
#
# Keeps ghcr.io/jonathanmcohen/platehouse-slicer current with OrcaSlicer:
#
#   detect: pick the Orca version -> resolve its pins -> check the registry
#   build:  build (load) -> smoke slice -> Trivy report (never fails)
#           -> push by digest -> check the pushed image is the one tested
#           -> tag orca-X.Y.Z, the run tag and, on a run from a release
#           tag, the release's version tag -> move stable
#   report-failure: when detect or build failed, open an issue (or comment on
#           the open one with the same title)
#
# When it runs:
# - daily at 05:00 UTC. It reads OrcaSlicer's latest release (the API leaves
#   out drafts and prereleases) and needs its tag to be vX.Y.Z. When
#   platehouse-slicer:orca-X.Y.Z already exists the run stops there: the
#   registry is the state, so there is no bot PR and nothing to commit. Only
#   the daily run asks the registry.
# - on a pushed release tag v*.*.*, at the latest Orca release, so a change to
#   the slicer wrapper ships with the release. It always builds. A prerelease
#   tag (v0.1.0-rc.1) publishes orca-X.Y.Z and its run tag but
#   leaves stable alone (the maintainer, 2026-11-15); a plain vX.Y.Z tag moves it. The
#   daily run never promotes such a version, as its orca-X.Y.Z exists; the
#   run's summary says so.
# - by hand (workflow_dispatch), at orca_version when given, else the latest
#   release. It must be started from main or a release tag (like release.yml,
#   it refuses any other branch before anything is built, so unreviewed slicer
#   code never reaches stable); from main or a plain vX.Y.Z tag it always
#   builds and moves stable, from a prerelease tag it leaves stable alone, as
#   a push of that tag would. force_fail fails the smoke
#   slice on purpose after it ran, to test the failure path.
#   GitHub runs a schedule or a dispatch only for a workflow file on the
#   default branch, so neither works until this file reaches main.
#
# The pins. apps/slicer/Dockerfile pins Orca 2.5.0 by the AppImage's sha256
# (ORCA_SHA256) and the commit its tag points to (ORCA_SRC_SHA, for the
# profile JSON). For the version picked here both are resolved again: the
# sha256 from the release asset's digest in GitHub's API, the commit from git
# ls-remote (the peeled commit of an annotated tag, else the tag's own), and
# both are passed as build args with ORCA_VERSION. If either cannot be
# resolved the run fails before anything is built. For the version the
# Dockerfile pins, the resolved values must equal the Dockerfile's, so a
# re-uploaded asset or a moved tag fails the run instead of replacing a
# reviewed pin.
#
# The smoke slice runs the built image the way examples/docker-compose.yml does (read-only root,
# noexec tmpfs at /work, every capability dropped, no-new-privileges) through
# the container test harness, and slices every plate of
# buildSliceable({plates: 2, filaments: 2}) and buildSliceable({plates: 3,
# filaments: 4}) on the P1S 0.4. It passes only when every plate is status ok
# with a time and a weight above zero. The fixtures are generated in the job,
# so no designer file is ever used.
#
# Publishing. Nothing is pushed until the smoke slice passed. The push builds
# the image a second time, by digest and with no tag, and its manifest digest
# (docker/build-push-action's digest output, never imageid; PR #217) must
# equal the tested build's, or the job fails before any tag. Then orca-X.Y.Z
# and the run tag, orca-X.Y.Z-r<run number> (orca-X.Y.Z-r<run number>.<attempt>
# on a re-run, which keeps the run number; issue #221), are pointed at that
# digest and read back, and
# only then stable (not on a prerelease tag).
#
# The release's version tag. A run started from a release tag vX.Y.Z or
# vX.Y.Z-rc.N (its push, a re-run of it, or a run by hand from that tag) also
# tags the image X.Y.Z or X.Y.Z-rc.N, in the same create as the orca tags,
# so the build made for a release can be found afterwards by the same name as
# the app image's platehouse:X.Y.Z. Daily runs and runs from main tag no
# version. This workflow never moves rc: .github/workflows/rc-tag.yml runs
# after every run of this workflow or release.yml and points both images' rc
# at the highest vX.Y.Z or vX.Y.Z-rc.N whose two version tags both exist.
#
# Before any push a Trivy scan
# reports fixable HIGH and CRITICAL findings in the job log; it is a report
# and never fails the job. imagetools create runs with --prefer-index=false so each
# tag is a carbon copy of the pushed manifest (by default a single source is
# wrapped in a new index, whose digest would not be the tested one). A failed
# digest check leaves the pushed digest untagged in the package; nothing points
# at it and it can be deleted by hand. A failure before the tag step touches no
# tag. A failure inside it (a readback, or a passing GHCR error) can leave
# orca-X.Y.Z, and stable if it had got that far, at the new digest; the step
# records the tags it reached and the failure issue lists them. The daily run
# then sees orca-X.Y.Z and never retries, so the issue says to run by hand.
#
# Rollback: README.md, "Slicer image". Point stable back at the previous
# orca-X.Y.Z with the same imagetools command.
#
# The image is amd64 only (OpenSCAD has no current arm64 build).
# Actions are pinned to the exact tags release.yml uses. Every job after detect
# carries an explicit !cancelled() condition, because a skip propagates down a
# needs chain unless a job says otherwise. Buildx provenance is off (no build
# attestation, by the release rules). Each job gets only the permissions it uses;
# together they are contents: read, packages: write and issues: write.
name: slicer-image

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      orca_version:
        description: "OrcaSlicer version to build, X.Y.Z. Empty builds the latest stable release."
        required: false
        default: ""
        type: string
      force_fail:
        description: "Fail the smoke slice on purpose, to test that nothing is pushed and an issue opens."
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Never cancel a publish part way; a second run waits for the first, so two
# runs never move stable at the same time.
concurrency:
  group: slicer-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jonathanmcohen/platehouse-slicer
  ORCA_REPO: OrcaSlicer/OrcaSlicer
  ORCA_GIT: https://github.com/OrcaSlicer/OrcaSlicer.git

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Find the OrcaSlicer release to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      stable: ${{ steps.pick.outputs.stable }}
      release: ${{ steps.pick.outputs.release }}
      orca_sha256: ${{ steps.pins.outputs.orca_sha256 }}
      orca_src_sha: ${{ steps.pins.outputs.orca_src_sha }}
      build: ${{ steps.registry.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The version: orca_version on a dispatch that gives one, else the
      # latest release. Either way the release must be published (not a
      # draft, not a prerelease) and its tag vX.Y.Z. A tag push must be a
      # semver tag, as release.yml's gate requires.
      - name: Pick the version
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.orca_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            # stable moves on daily and manual runs and on a plain vX.Y.Z tag;
            # a prerelease tag publishes the orca tags and leaves stable alone.
            # A run by hand builds apps/slicer from the ref it was started on,
            # so it must start from main or a release tag, as release.yml's
            # gate requires: a dispatch from any other branch would publish
            # unreviewed code as orca-X.Y.Z and stable.
            # release: the version of the release tag this run started from
            # (X.Y.Z or X.Y.Z-rc.1 for v0.1.0-rc.1), tagged beside the orca
            # tags; empty for a daily run or a run from main.
            stable=true
            release=""
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ] && [[ "$REF" != refs/tags/* ]]; then
              echo "::error::${REF} is not main or a release tag; a run by hand must start from main or a vX.Y.Z tag, so nothing is built"
              exit 1
            fi
            if [ "$EVENT" = "push" ] || [[ "$REF" == refs/tags/* ]]; then
              re='^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
              if [[ ! "$REF" =~ $re ]]; then
                echo "::error::${REF} is not a semver tag vMAJOR.MINOR.PATCH[-prerelease]; nothing is built"
                exit 1
              fi
              if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                stable=false
                echo "${REF#refs/tags/} is a prerelease tag: stable will not move"
              fi
              release="${REF#refs/tags/v}"
              echo "The image will also be tagged ${release}, the release's version"
            fi
            echo "stable=${stable}" >>"$GITHUB_OUTPUT"
            echo "release=${release}" >>"$GITHUB_OUTPUT"
            if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
              if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::orca_version '${INPUT_VERSION}' is not X.Y.Z"
                exit 1
              fi
              release="$(gh api "repos/${ORCA_REPO}/releases/tags/v${INPUT_VERSION}")"
            else
              release="$(gh api "repos/${ORCA_REPO}/releases/latest")"
            fi
            tag="$(jq -r '.tag_name // ""' <<<"$release")"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::OrcaSlicer's release tag '${tag}' is not vX.Y.Z (betas and release candidates are skipped)"
              exit 1
            fi
            if [ -n "$INPUT_VERSION" ] && [ "$EVENT" = "workflow_dispatch" ] && [ "$tag" != "v${INPUT_VERSION}" ]; then
              echo "::error::asked for v${INPUT_VERSION}, GitHub returned the release ${tag}"
              exit 1
            fi
            # Written before the last check, so a failure issue can name it.
            version="${tag#v}"
            echo "version=${version}" >>"$GITHUB_OUTPUT"
            if [ "$(jq -r '.draft' <<<"$release")" != "false" ] || [ "$(jq -r '.prerelease' <<<"$release")" != "false" ]; then
              echo "::error::OrcaSlicer ${tag} is a draft or a prerelease; only stable releases are built"
              exit 1
            fi
            echo "OrcaSlicer ${version} (${EVENT})"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/pick.log"

      # ORCA_SHA256: the digest GitHub records for the exact asset the
      # Dockerfile downloads. ORCA_SRC_SHA: the commit the tag points to.
      - name: Resolve the Orca pins
        id: pins
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            asset="OrcaSlicer_Linux_AppImage_Ubuntu2404_V${VERSION}.AppImage"
            assets="$(gh api "repos/${ORCA_REPO}/releases/tags/v${VERSION}" | jq -c --arg n "$asset" '[.assets[] | select(.name == $n)]')"
            if [ "$(jq 'length' <<<"$assets")" != "1" ]; then
              echo "::error::OrcaSlicer v${VERSION} has no single asset named ${asset}"
              exit 1
            fi
            if [ "$(jq -r '.[0].state' <<<"$assets")" != "uploaded" ]; then
              echo "::error::${asset} is not fully uploaded"
              exit 1
            fi
            digest="$(jq -r '.[0].digest // ""' <<<"$assets")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::GitHub records no sha256 digest for ${asset} (got '${digest}')"
              exit 1
            fi
            orca_sha256="${digest#sha256:}"

            refs="$(git ls-remote "$ORCA_GIT" "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}")"
            peeled="$(awk -v r="refs/tags/v${VERSION}^{}" '$2 == r { print $1 }' <<<"$refs")"
            plain="$(awk -v r="refs/tags/v${VERSION}" '$2 == r { print $1 }' <<<"$refs")"
            orca_src_sha="${peeled:-$plain}"
            if [[ ! "$orca_src_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::git ls-remote found no commit for refs/tags/v${VERSION} (got '${orca_src_sha}')"
              exit 1
            fi

            # For the version the Dockerfile pins, its reviewed values win.
            dockerfile=apps/slicer/Dockerfile
            pinned="$(sed -n 's/^ARG ORCA_VERSION=//p' "$dockerfile")"
            if [ "$VERSION" = "$pinned" ]; then
              want_sha256="$(sed -n 's/^ARG ORCA_SHA256=//p' "$dockerfile")"
              want_src="$(sed -n 's/^ARG ORCA_SRC_SHA=//p' "$dockerfile")"
              if [ "$orca_sha256" != "$want_sha256" ] || [ "$orca_src_sha" != "$want_src" ]; then
                echo "::error::OrcaSlicer ${VERSION} resolved to sha256 ${orca_sha256} and commit ${orca_src_sha}, but ${dockerfile} pins ${want_sha256} and ${want_src}; nothing is built"
                exit 1
              fi
              echo "OrcaSlicer ${VERSION} is the version ${dockerfile} pins, and its pins match"
            fi

            echo "orca_sha256=${orca_sha256}" >>"$GITHUB_OUTPUT"
            echo "orca_src_sha=${orca_src_sha}" >>"$GITHUB_OUTPUT"
            echo "${asset}: sha256 ${orca_sha256}"
            echo "refs/tags/v${VERSION}: commit ${orca_src_sha}"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/pins.log"

      # Only a daily run asks the registry. A tag push or a manual run always
      # builds, so GHCR's answer for a package that does not exist yet can
      # never block it.
      - name: Log in to GHCR
        id: login
        if: ${{ github.event_name == 'schedule' }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "not found" from the registry is the only answer that means the tag
      # does not exist; any other error stops the daily run rather than
      # guessing.
      - name: Check the registry
        id: registry
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            if [ "$EVENT" != "schedule" ]; then
              echo "A ${EVENT} run always builds; the registry is not asked"
              echo "build=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            ref="${IMAGE}:orca-${VERSION}"
            status=0
            out="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1)" || status=$?
            if [ "$status" -eq 0 ]; then
              exists=true
              echo "${ref} exists at ${out}"
            elif grep -q ': not found' <<<"$out"; then
              exists=false
              echo "${ref} does not exist yet"
            else
              echo "$out"
              echo "::error::could not tell whether ${ref} exists (exit ${status}); nothing is built"
              exit 1
            fi
            if [ "$exists" = "true" ]; then
              build=false
              echo "Up to date: ${ref} is already published"
              echo "Up to date: \`${ref}\` is already published." >>"$GITHUB_STEP_SUMMARY"
            else
              build=true
            fi
            echo "build=${build}" >>"$GITHUB_OUTPUT"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/registry.log"

      - name: Keep the failing step's log tail
        if: ${{ failure() }}
        env:
          JOB: detect
          OUTCOMES: >-
            pick=${{ steps.pick.outcome }}
            pins=${{ steps.pins.outcome }}
            login=${{ steps.login.outcome }}
            registry=${{ steps.registry.outcome }}
        run: |
          failed=""
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = "failure" ]; then
              failed="${pair%%=*}"
              break
            fi
          done
          case "$failed" in
            pick) name="Pick the version" ;;
            pins) name="Resolve the Orca pins" ;;
            login) name="Log in to GHCR" ;;
            registry) name="Check the registry" ;;
            *) name="an unnamed step of the detect job" ;;
          esac
          mkdir -p failure
          {
            echo "step: ${name}"
            log="$RUNNER_TEMP/logs/${failed}.log"
            if [ -n "$failed" ] && [ -s "$log" ]; then
              tail -n 80 "$log"
            else
              echo "(no log was kept for this step; see the run's log)"
            fi
          } >"failure/${JOB}.txt"
          cat "failure/${JOB}.txt"

      - name: Upload the log tail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failure-detect
          path: failure/detect.txt
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build, smoke-slice and publish
    needs: detect
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # Read by the failure issue: a job's outputs are kept when it fails, so a
    # failed tag step still says which tags it had pointed at the digest.
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      LOCAL: platehouse-slicer:smoke
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # 1) The image for this Orca version, loaded into the runner's Docker so
      #    the smoke slice can run it.
      - name: Build (load)
        id: load
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/slicer/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.LOCAL }}
          build-args: |
            ORCA_VERSION=${{ needs.detect.outputs.version }}
            ORCA_SHA256=${{ needs.detect.outputs.orca_sha256 }}
            ORCA_SRC_SHA=${{ needs.detect.outputs.orca_src_sha }}
          cache-from: type=gha,scope=slicer-image
          cache-to: type=gha,mode=max,scope=slicer-image

      # 2) The smoke slice, through the container test harness against the
      #    image built above (SLICER_IMAGE names it; SLICER_IMAGE_PREBUILT
      #    tells the harness not to build its own). The same zero-test guard
      #    as ci.yml's test jobs. A failure ends the job: no push, no tag.
      - name: Smoke slice
        id: smoke
        env:
          SLICER_IMAGE: ${{ env.LOCAL }}
          SLICER_IMAGE_PREBUILT: "1"
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            status=0
            pnpm exec vitest run --project container apps/slicer/test/container/smoke.test.ts --reporter=default --reporter=json --outputFile=smoke-report.json || status=$?
            if [ -s smoke-report.json ]; then
              total="$(jq '.numTotalTests' smoke-report.json)"
              skipped="$(jq '.numPendingTests + .numTodoTests' smoke-report.json)"
              ran=$((total - skipped))
              echo "smoke: ${ran} tests ran, ${skipped} skipped, ${total} collected"
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::the smoke slice failed (vitest exit ${status}); its output above names the plate"
              exit "$status"
            fi
            if [ ! -s smoke-report.json ]; then
              echo "::error::No tests ran (vitest wrote no report)"
              exit 1
            fi
            if [ "$ran" -eq 0 ]; then
              echo "::error::No tests ran"
              exit 1
            fi
            if [ "$FORCE_FAIL" = "true" ]; then
              echo "::error::force_fail is set: the smoke slice passed, and fails on purpose; nothing is pushed"
              exit 1
            fi
            echo "The smoke slice passed for OrcaSlicer ${VERSION}"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/smoke.log"

      # A report only (the maintainer, 2026-11-15): fixable HIGH and CRITICAL findings in
      # the built image, as a table in this log, before anything is pushed.
      # It never fails the job: exit-code 0, and continue-on-error covers the
      # action itself failing (a Trivy database download, say). Same action
      # and Trivy version as release.yml. The cache stays in the runner's temp
      # folder, outside the checkout, so it never reaches the push build's
      # context.
      - name: Trivy report (informational, does not fail the job)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.76.2

      - name: Log in to GHCR
        id: login
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3) The same build again, pushed by digest with no tag. Every step
      #    should be a cache hit; step 4 checks that it was.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/slicer/Dockerfile
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ORCA_VERSION=${{ needs.detect.outputs.version }}
            ORCA_SHA256=${{ needs.detect.outputs.orca_sha256 }}
            ORCA_SRC_SHA=${{ needs.detect.outputs.orca_src_sha }}
          cache-from: type=gha,scope=slicer-image
          cache-to: type=gha,mode=max,scope=slicer-image

      # 4) The pushed image must be the one the smoke slice ran. The apt
      #    layers talk to the network, so if one missed the cache in step 3 the
      #    push would hold packages the smoke slice never saw. Both builds
      #    report their manifest digest (the digest output, which names the
      #    config and every layer). Not imageid: depending on the runner's
      #    exporter it is a config digest on one build and a manifest digest on
      #    the other (release run 43724090714, PR #217). On a mismatch the job
      #    fails here, before any tag.
      - name: Check the pushed image is the one tested
        id: check
        env:
          TESTED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            re='^sha256:[0-9a-f]{64}$'
            if [[ ! "$TESTED" =~ $re || ! "$PUSHED" =~ $re ]]; then
              echo "::error::a build returned no manifest digest (tested ${TESTED:-none}, pushed ${PUSHED:-none})"
              exit 1
            fi
            if [[ "$PUSHED" != "$TESTED" ]]; then
              echo "::error::the pushed manifest ${PUSHED} is not the tested manifest ${TESTED}, so the pushed image is not proven to be the one smoke-sliced. Compare the exporting manifest and exporting config lines of both builds in this job log: if the configs and layers match, the exporters disagree on format and a re-run will fail the same way; otherwise re-run the workflow."
              exit 1
            fi
            echo "The pushed image is the tested image, manifest ${TESTED}"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/check.log"

      # 5) The version tags (orca-X.Y.Z, the run tag and, on a run from a
      #    release tag, the release's version RELEASE), read back; then
      #    stable, read back, unless this is a prerelease tag's run
      #    (MOVE_STABLE false). A carbon copy each (--prefer-index=false), so
      #    every tag is the tested digest.
      - name: Tag the image and move stable
        id: tag
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MOVE_STABLE: ${{ needs.detect.outputs.stable }}
          RELEASE: ${{ needs.detect.outputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          {
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the push returned no digest (${DIGEST:-none})"
              exit 1
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$RUN_NUMBER" =~ ^[0-9]+$ || ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::version '${VERSION}', run number '${RUN_NUMBER}' or run attempt '${RUN_ATTEMPT}' is malformed"
              exit 1
            fi
            # A re-run keeps the run number (issue #221), so attempt 1 tags
            # orca-X.Y.Z-r<run> and a later attempt orca-X.Y.Z-r<run>.<attempt>,
            # leaving the first attempt's tag on the image it named.
            run_tag="orca-${VERSION}-r${RUN_NUMBER}"
            if [ "$RUN_ATTEMPT" -gt 1 ]; then run_tag="${run_tag}.${RUN_ATTEMPT}"; fi
            if [ "$MOVE_STABLE" != "true" ] && [ "$MOVE_STABLE" != "false" ]; then
              echo "::error::detect gave no stable decision ('${MOVE_STABLE}'); nothing is tagged"
              exit 1
            fi
            # RELEASE is empty, or the semver version of the release tag the
            # run started from (the same rule as the pick step's tag check),
            # and a valid image tag (at most 128 characters).
            if [ -n "$RELEASE" ]; then
              if [[ ! "$RELEASE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || [ "${#RELEASE}" -gt 128 ]; then
                echo "::error::the release version '${RELEASE}' from detect is malformed; nothing is tagged"
                exit 1
              fi
            fi
            src="${IMAGE}@${DIGEST}"
            # tagged: the tags this step has pointed, or is pointing, at the
            # digest, for the failure issue. Written before each create, so a
            # create or readback that fails part way still names its tags.
            tags="orca-${VERSION}, ${run_tag}"
            release_args=()
            if [ -n "$RELEASE" ]; then
              tags="${tags}, ${RELEASE}"
              release_args=(-t "${IMAGE}:${RELEASE}")
            fi
            echo "tagged=${tags}" >>"$GITHUB_OUTPUT"
            readback() {
              local got
              got="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}')"
              if [ "$got" != "$DIGEST" ]; then
                echo "::error::$1 is ${got}, not ${DIGEST}"
                exit 1
              fi
            }
            docker buildx imagetools create --prefer-index=false \
              -t "${IMAGE}:orca-${VERSION}" -t "${IMAGE}:${run_tag}" "${release_args[@]}" "$src"
            readback "${IMAGE}:orca-${VERSION}"
            readback "${IMAGE}:${run_tag}"
            if [ -n "$RELEASE" ]; then readback "${IMAGE}:${RELEASE}"; fi
            if [ "$MOVE_STABLE" = "true" ]; then
              tags="${tags}, stable"
              echo "tagged=${tags}" >>"$GITHUB_OUTPUT"
              docker buildx imagetools create --prefer-index=false -t "${IMAGE}:stable" "$src"
              readback "${IMAGE}:stable"
            else
              echo "A prerelease tag's run: stable is left where it was"
            fi
            {
              echo "### Published ${IMAGE} for OrcaSlicer ${VERSION}"
              echo ""
              echo "- digest: \`${DIGEST}\`"
              echo "- tags: ${tags}"
              if [ "$MOVE_STABLE" != "true" ]; then
                echo "- stable not moved (prerelease tag). The daily run will not move it either: it sees orca-${VERSION} and builds nothing. stable reaches this version on a plain release tag or a run by hand."
              fi
            } >>"$GITHUB_STEP_SUMMARY"
            echo "Published ${tags} at ${DIGEST}"
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/tag.log"

      # For a failed build step there is no kept log, so its tail comes from
      # buildx's own record of the most recent build.
      - name: Keep the failing step's log tail
        if: ${{ failure() }}
        env:
          JOB: build
          OUTCOMES: >-
            load=${{ steps.load.outcome }}
            smoke=${{ steps.smoke.outcome }}
            login=${{ steps.login.outcome }}
            push=${{ steps.push.outcome }}
            check=${{ steps.check.outcome }}
            tag=${{ steps.tag.outcome }}
        run: |
          failed=""
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = "failure" ]; then
              failed="${pair%%=*}"
              break
            fi
          done
          case "$failed" in
            load) name="Build (load)" ;;
            smoke) name="Smoke slice" ;;
            login) name="Log in to GHCR" ;;
            push) name="Push by digest" ;;
            check) name="Check the pushed image is the one tested" ;;
            tag) name="Tag the image and move stable" ;;
            *) name="an unnamed step of the build job (checkout, setup or install)" ;;
          esac
          mkdir -p failure
          {
            echo "step: ${name}"
            log="$RUNNER_TEMP/logs/${failed}.log"
            if [ -n "$failed" ] && [ -s "$log" ]; then
              tail -n 80 "$log"
            elif [ "$failed" = "load" ] || [ "$failed" = "push" ]; then
              timeout 60 docker buildx history logs 2>&1 | tail -n 80 || echo "(buildx kept no log of the build; see the run's log)"
            else
              echo "(no log was kept for this step; see the run's log)"
            fi
          } >"failure/${JOB}.txt"
          cat "failure/${JOB}.txt"

      - name: Upload the log tail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failure-build
          path: failure/build.txt
          if-no-files-found: ignore
          retention-days: 7

  report-failure:
    name: Open an issue on failure
    needs: [detect, build]
    if: ${{ !cancelled() && (needs.detect.result == 'failure' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      # A job that timed out or lost its runner kept no tail; the issue then
      # says so and links the run.
      - name: Download the log tail
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: failure-*
          path: failure
          merge-multiple: true

      # One open issue per version: a daily run that fails again comments on
      # the open issue with the same title instead of opening another.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect.outputs.version }}
          INPUT_VERSION: ${{ inputs.orca_version }}
          EVENT: ${{ github.event_name }}
          TAGGED: ${{ needs.build.outputs.tagged }}
          DIGEST: ${{ needs.build.outputs.digest }}
          STABLE: ${{ needs.detect.outputs.stable }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="$VERSION"
          if [ -z "$version" ] && [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$INPUT_VERSION"; fi
          if [ -z "$version" ]; then version="(version not found)"; fi
          title="Slicer image failed for OrcaSlicer ${version}"
          tail=""
          for f in failure/detect.txt failure/build.txt; do
            if [ -s "$f" ]; then tail="$(cat "$f")"; fi
          done
          if [ -z "$tail" ]; then
            tail="(no log tail was kept: the job may have timed out or lost its runner)"
          fi
          # Keep the code block intact and the body under GitHub's limit.
          tail="$(printf '%s\n' "$tail" | sed 's/```/'"'''"'/g' | tail -c 50000)"
          # TAGGED is empty unless the tag step began. Once it has, orca-X.Y.Z
          # may exist, and the daily run then reports Up to date for this
          # version and never builds it again, so it cannot be the retry.
          {
            if [ -z "$TAGGED" ]; then
              echo "The slicer image workflow failed for OrcaSlicer ${version} (${EVENT} run). No tag was created or moved, so stable still points at the last image that passed; nothing needs rolling back."
            else
              echo "The slicer image workflow failed for OrcaSlicer ${version} (${EVENT} run) while tagging. These tags had been pointed, or were being pointed, at ${DIGEST:-the pushed digest}: ${TAGGED}. Check each with docker buildx imagetools inspect before relying on it."
              echo ""
              if [[ ", ${TAGGED}," == *", stable,"* ]]; then
                echo "stable may now point at that digest. If it should not, roll it back (README.md, Rolling the slicer back)."
              else
                echo "stable was not touched and still points at the last image that passed."
              fi
            fi
            echo ""
            echo "rc is not moved by this workflow: the rc-tag workflow points it at the newest version with both images published after every run of slicer-image or release, so rc fixes itself on the next successful run of either workflow, or when rc-tag is run by hand (Actions, rc-tag, Run workflow)."
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo "Last lines of the failing step's log:"
            echo ""
            echo '```text'
            printf '%s\n' "$tail"
            echo '```'
            echo ""
            if [ -n "$TAGGED" ] && [ "$STABLE" = "false" ]; then
              # The placeholder sits in a code span, single-quoted so bash keeps
              # the backticks: bare, GitHub would strip <run> as an HTML tag.
              # Only the tag step sets TAGGED, so detect succeeded. Re-run failed jobs
              # re-runs build and the jobs after it and keeps detect's outputs
              # (version, pins, stable=false); Re-run all jobs would run detect again.
              echo "To fix: read the run's log, fix the cause, then re-run this run from its page (Re-run failed jobs). That re-runs the build job and the jobs after it and keeps detect's outputs, so it builds ${version} again and leaves stable alone; a run by hand would move stable. Use Re-run failed jobs, not Re-run all jobs: Re-run all jobs runs detect again, which reads OrcaSlicer's latest release again and builds a newer version instead if Orca has shipped one since this run. The re-run gets its own "'`orca-'"${version}"'-r<run>.<attempt>`'" tag and leaves this run's tag alone. The daily run will not retry it once orca-${version} is in the registry, as this run may have left it: it reports Up to date."
            elif [ -n "$TAGGED" ]; then
              echo "To fix: read the run's log, fix the cause, then run the workflow by hand (Actions, slicer-image, Run workflow, orca_version ${version}). The daily run will not retry it once orca-${version} is in the registry, as this run may have left it: it reports Up to date and never moves stable to this version."
            elif [ "$EVENT" = "schedule" ]; then
              echo "To fix: read the run's log, fix the cause, then run the workflow again (Actions, slicer-image, Run workflow) or let the next daily run retry it."
            else
              orca_tag="orca-${version}"
              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then orca_tag="its orca-X.Y.Z tag"; fi
              echo "To fix: read the run's log, fix the cause, then run the workflow again (Actions, slicer-image, Run workflow). The next daily run retries this version only if ${orca_tag} is not in the registry yet."
            fi
          } >body.md
          existing="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file body.md
            echo "Commented on issue #${existing}: ${title}"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file body.md
            echo "Opened an issue: ${title}"
          fi
