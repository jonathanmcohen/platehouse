# Publishes the user docs site to GitHub Pages.
#
# The site is the Docusaurus package apps/docs, which builds the pages in
# docs/. The ci workflow's "Docs build" job stays the pull-request check;
# pull requests and merges publish nothing (#499). The site describes the
# latest release, not unreleased work, so this workflow runs on a v*.*.* tag
# push and by hand (Actions, docs-pages, Run workflow), and its first step
# decides whether to publish:
#   - a push of the highest plain vX.Y.Z tag (release-gate.mjs latest, the
#     rule that decides the latest image tag) publishes that tag, if its
#     commit is on main or a release/** branch, as release.yml checks;
#   - a push of any other tag (an rc, v0.0.0-test, any other prerelease, or a
#     backport below the highest release) publishes nothing: a notice, and a
#     green run;
#   - a run by hand from the highest release tag republishes it, for example
#     after a Pages outage;
#   - a run by hand from main publishes main only while the root
#     package.json's version is the highest release, so a docs fix merged
#     after the release goes out, and nothing once main is ahead of it;
#   - a run by hand from anything else fails.
# The tags come from the tags API, as release.yml reads them.
#
# Pages has to be set up once: Settings, Pages, Build and deployment, Source:
# GitHub Actions, and the github-pages environment needs a deployment rule
# for tags (Ref type Tag, Name pattern v*.*.*) beside its main branch rule.
# RELEASING.md has the steps. Without the tag rule, a tag's deploy job fails
# with an environment protection error and the site stays as it was; add the
# rule, then run this workflow by hand from the tag.
#
# A tag push starts this workflow beside the image builds, so the docs can go
# live some minutes before both images are out.
#
# The site's address comes from the Pages setup, not from this repository:
# actions/configure-pages reports the origin and the base path, and the build
# step passes them to docusaurus.config.mjs as DOCS_SITE_URL and
# DOCS_BASE_PATH. So a renamed or moved repository, or a custom domain set in
# the Pages settings, needs no change here.
#
# Permissions: the build job reads the repository and the Pages setup
# (actions/configure-pages calls the Pages API, which needs pages: read), and
# its job token reads the tags. Only the deploy job can publish: pages: write
# and id-token: write, and nothing else. No secret is used.
name: docs-pages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a deploy in progress is never cancelled. A run
# that starts while another is going waits for it; if a third starts in the
# meantime, GitHub drops the waiting one in favour of the newest, which
# decides again from its own ref.
concurrency:
  group: docs-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the docs site for Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      # Full history, so the branch check sees every branch.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No pnpm cache: a run that publishes nothing skips Install, so the
      # store is never on disk, and on a cache miss setup-node's post step
      # would fail the job.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Whether this run publishes, by the rules in the header. Every step
      # after this one, and the deploy job, runs only when it says so. A
      # failed tags call fails the step, never reads as "not the highest".
      # As in release.yml, a tag publishes only a commit on main or a
      # release/** branch.
      - name: Which ref to publish
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # encode: $1 as workflow-command text (% CR LF encoded).
          encode() {
            local s="${1//%/%25}"
            s="${s//$'\r'/%0D}"
            printf '%s' "${s//$'\n'/%0A}"
          }
          case "$REF" in
            refs/heads/main)
              version="$(node -p 'require("./package.json").version')"
              if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::main's package.json version $(encode "$version") is not X.Y.Z, so nothing is published"
                exit 1
              fi
              tag="v${version}"
              ;;
            refs/tags/*)
              tag="${REF#refs/tags/}"
              ;;
            *)
              echo "::error::docs-pages publishes only from main or the highest release tag; $(encode "$REF") is neither"
              exit 1
              ;;
          esac
          refs="$(gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" --jq '.[].ref')"
          tags="$(printf '%s\n' "$refs" | sed -n 's#^refs/tags/##p')"
          latest="$(printf '%s\n' "$tags" | node .github/scripts/release-gate.mjs latest "$tag")"
          highest="$(printf '%s\n' "$tags" | node .github/scripts/release-gate.mjs highest)"
          if [ "$latest" != "true" ]; then
            if [ "$REF" = "refs/heads/main" ]; then
              echo "::error::main's package.json says ${version}, but the highest release is ${highest:-none}: main is ahead of the release, so nothing is published. Publish a release's docs from its tag."
              exit 1
            fi
            if [ "$EVENT" = "push" ]; then
              echo "::notice::$(encode "$tag") is not the highest release (${highest:-none}), so the docs site is not published: only the highest plain vX.Y.Z tag publishes, never an rc, a throwaway tag or a backport"
              echo "publish=false" >>"$GITHUB_OUTPUT"
              echo "Nothing published: $(encode "$tag") is not the highest release (${highest:-none})." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::$(encode "$tag") is not the highest release (${highest:-none}); docs-pages publishes only from main or the highest release tag"
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            branches="$(git branch -r --contains "$SHA")"
            if ! grep -Eq '^[[:space:]]*origin/(main$|release/)' <<<"$branches"; then
              echo "::error::$(encode "$tag") is at $(encode "$SHA"), which is on neither origin/main nor an origin/release/ branch, so the docs site is not published"
              exit 1
            fi
          fi
          {
            echo "publish=true"
            echo "ref=${REF}"
          } >>"$GITHUB_OUTPUT"
          echo "Publishing the docs site from ${REF} (${tag}, the highest release)." >>"$GITHUB_STEP_SUMMARY"
          echo "${REF}: publishing ${tag}"
      - name: Configure Pages
        if: ${{ steps.ref.outputs.publish == 'true' }}
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Only the docs site and what it depends on, as in the ci docs job.
      - name: Install
        if: ${{ steps.ref.outputs.publish == 'true' }}
        run: pnpm install --frozen-lockfile --filter @platehouse/docs
      # docusaurus.config.mjs fails the build on a broken link or anchor, on an
      # empty or malformed DOCS_SITE_URL, and on a malformed DOCS_BASE_PATH (an
      # empty one is the site root).
      - name: Build the docs site
        if: ${{ steps.ref.outputs.publish == 'true' }}
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter @platehouse/docs run build
      - name: Upload the site
        if: ${{ steps.ref.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
