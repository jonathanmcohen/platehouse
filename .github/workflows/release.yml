# Release workflow for the app image (build plan Task 24; AC-093, AC-094).
#
# A pushed tag vX.Y.Z builds docker/app.Dockerfile natively for linux/amd64
# (ubuntu-latest) and linux/arm64 (ubuntu-24.04-arm, no QEMU) and publishes
# ghcr.io/jonathanmcohen/platehouse. It follows pgvector's
# build-and-publish.yml at ce60a37 without its cosign, SBOM or attest steps:
#
#   gate -> per arch: build (load) -> smoke test -> Trivy gate -> push by digest
#        -> check the pushed image is the tested one
#        -> merge: one manifest list from both digests, then the tags
#
# Nothing gets a tag unless both arches pass. Each arch pushes its image by
# digest only, after its smoke test (docker/test-app-image.sh: the image's
# HEALTHCHECK healthy against Postgres and the S3 test server, /healthz 200,
# every shipped migration applied) and its Trivy gate pass; a failure there
# pushes nothing for that arch. The push builds the image a second time, so
# its manifest digest must equal the tested build's, or the arch fails and its
# digest is never handed to the merge job. The merge job runs only when both
# arches succeeded, joins the two digests with docker buildx imagetools
# create, applies the tags, and reads the result back from the registry. If
# one arch fails after the other pushed, that pushed digest stays untagged in
# the package; nothing points at it, and it can be deleted by hand.
#
# Labels (issue #317): both per-arch builds carry the standard OCI labels
# docker/metadata-action computes (version, revision, source, created, title,
# description, url, licenses), so a running container says which version
# and commit it is; the loaded image is checked for them before the push, and
# the merge job puts the same keys on the index as annotations and reads all
# three back from the registry (docker/check-image-labels.sh).
#
# Tags come from docker/metadata-action with type=semver,pattern={{version}}
# alone: v0.1.0 gives 0.1.0 and latest, and a prerelease such as v0.0.0-test
# gives 0.0.0-test and no latest, so latest moves only on a stable tag. There
# is no hand-written latest entry: it would publish latest even for a tag that
# is not valid semver.
#
# workflow_dispatch is for the plan's first release step: dispatching this
# workflow against a throwaway tag (gh workflow run release.yml --ref
# v0.0.0-test). The gate job refuses any run whose ref is not a semver tag
# before anything is built, so a dispatch from a branch pushes nothing.
#
# Every job after the gate carries if: !cancelled() && needs.<dep>.result ==
# 'success', so a skipped or failed job stops the chain explicitly, because a
# skip propagates down a needs chain. Buildx's own provenance attestation is turned off
# (AC-094: no build attestation), so each arch digest is a plain image.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish part way; a second run for the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jonathanmcohen/platehouse

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The ref is a semver tag
        env:
          REF: ${{ github.ref }}
        run: |
          re='^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$REF" =~ $re ]]; then
            echo "::error::${REF} is not a semver tag vMAJOR.MINOR.PATCH[-prerelease]; nothing is built"
            exit 1
          fi
          echo "Releasing ${REF#refs/tags/}"

  build:
    name: Build, check and push (${{ matrix.arch }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      LOCAL: platehouse:release-${{ matrix.arch }}
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # The standard OCI labels (issue #317): version, revision, source,
      # created, title, description, url and licenses, as metadata-action
      # computes them. Only its labels are used here; the tags come from the
      # merge job. The semver entry is what gives the version label the tag's
      # version (0.1.1, not v0.1.1). Both builds below take these same labels,
      # one step output, so the pushed image still matches the tested one.
      - name: Labels for this ref
        id: labels
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      # 1) This arch, loaded into the runner's Docker so it can be run.
      #    OS_UPDATES_STAMP is unique to this run (id and attempt), so the
      #    runtime stage's apt-get upgrade (docker/app.Dockerfile) is never a
      #    cache hit and every release takes Debian's current fixes; the push
      #    below passes the same value, so it reuses this build's layers.
      - name: Build (load, this arch only)
        id: load
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: ${{ env.LOCAL }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: OS_UPDATES_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # 2) The smoke test. A failure ends the job: no push, no tag.
      - name: Smoke test
        run: docker/test-app-image.sh "$LOCAL" healthy

      # The tested image carries the labels, before anything is pushed.
      - name: Check the labels
        env:
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          docker/check-image-labels.sh local "$LOCAL" "$VERSION" "$GITHUB_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      # 3) The Trivy gate, as on pgvector: fixable HIGH or CRITICAL findings in
      #    the OS (Debian) packages fail the job before the push. Its cache is
      #    kept in the runner's temp folder, outside the checkout, so it never
      #    reaches a build context (a Trivy cache in the context once left
      #    root-owned files that failed an arm64 push). Both Trivy steps set
      #    the Trivy version, the same as ci.yml's gate, rather than the
      #    action's default (v0.70.0 for the action's v0.36.0).
      - name: Trivy gate (fail on fixable OS HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os
          exit-code: "1"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.76.2

      - name: Trivy full report (informational, does not fail the job)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.76.2

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4) The same build again, pushed by digest with no tag. Every step should
      #    be a cache hit; step 5 checks that it was.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.labels.outputs.labels }}
          build-args: OS_UPDATES_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # 5) The pushed image must be the one the smoke test and Trivy checked.
      #    The apt-get upgrade layer talks to the network, so if it missed the
      #    cache in step 4 (BuildKit pruned it, or the gha cache was evicted),
      #    apt would have run again and the push would hold packages neither
      #    check saw. Both builds report their manifest digest (the digest
      #    output, which names the config and every layer), so a rebuilt layer
      #    shows up as a different digest. Not imageid: where the runner's
      #    Docker loads through the OCI exporter, the load build reports no
      #    config digest and its imageid falls back to the manifest digest,
      #    while the push's imageid is the config digest, so identical images
      #    never matched (release run 43724090714, amd64). On a mismatch the
      #    job fails here, before the digest is recorded, so the merge job
      #    never tags it; the pushed digest stays untagged in the package, and
      #    re-running the release builds afresh.
      - name: Check the pushed image is the one tested
        env:
          TESTED: ${{ steps.load.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          re='^sha256:[0-9a-f]{64}$'
          if [[ ! "$TESTED" =~ $re || ! "$PUSHED" =~ $re ]]; then
            echo "::error::a build returned no manifest digest (tested ${TESTED:-none}, pushed ${PUSHED:-none})"
            exit 1
          fi
          if [[ "$PUSHED" != "$TESTED" ]]; then
            echo "::error::the pushed manifest ${PUSHED} is not the tested manifest ${TESTED}, so the pushed image is not proven to be the one smoke-tested and scanned. The manifests differ in the config, a layer, or only the manifest media type or layer compression. Compare the exporting manifest and exporting config lines of both builds in this job log: if the configs and layers match, the exporters disagree on format and a re-run will fail the same way; otherwise re-run the release."
            exit 1
          fi
          echo "The pushed image is the tested image, manifest ${TESTED}"

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the push returned no digest (${DIGEST:-none})"
            exit 1
          fi
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.arch }}"
          echo "${{ matrix.platform }} pushed as ${IMAGE}@${DIGEST}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag the multi-arch image
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # For docker/check-image-labels.sh, the read-back below.
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docker

      - name: Download the digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Tags for this ref
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      # The same OCI keys as the images' labels, as annotations on the index
      # (issue #317), so the multi-arch tag itself says its version, commit
      # and source, as the registry shows it. Only its annotations are used.
      - name: Annotations for the index
        id: annotations
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The manifest list from exactly the two arch digests, with the tags
      # metadata-action gave and the index annotations; then read back from
      # the registry: the version tag must list both platforms at those
      # digests, and latest, when this is a stable tag, must be the same
      # manifest list. Each digest's config must still carry the labels the
      # build set, and the index the annotations (docker/check-image-labels.sh).
      - name: Create the manifest list and check it
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
          ANNOTATIONS: ${{ steps.annotations.outputs.annotations }}
          LABELS_VERSION: ${{ steps.annotations.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(digests/*)
          [ "${#files[@]}" -eq 2 ] && [ -s digests/amd64 ] && [ -s digests/arm64 ] ||
            { echo "::error::expected the amd64 and arm64 digests only, got: ${files[*]}"; exit 1; }
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          [ "${#tags[@]}" -ge 1 ] || { echo "::error::metadata-action gave no tags for ${GITHUB_REF}"; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::metadata-action gave no version for ${GITHUB_REF}"; exit 1; }
          targs=()
          for t in "${tags[@]}"; do targs+=(-t "$t"); done
          [ "$LABELS_VERSION" = "$VERSION" ] ||
            { echo "::error::the labels say version '${LABELS_VERSION}', the tags '${VERSION}'"; exit 1; }
          mapfile -t annotations < <(printf '%s\n' "$ANNOTATIONS" | sed '/^$/d')
          [ "${#annotations[@]}" -ge 1 ] || { echo "::error::metadata-action gave no index annotations"; exit 1; }
          for a in "${annotations[@]}"; do targs+=(--annotation "$a"); done
          echo "Tagging ${tags[*]}"
          docker buildx imagetools create "${targs[@]}" "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"

          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker/check-image-labels.sh pushed "${IMAGE}@${amd64}" "$VERSION" "$GITHUB_SHA" "$source_url"
          docker/check-image-labels.sh pushed "${IMAGE}@${arm64}" "$VERSION" "$GITHUB_SHA" "$source_url"
          docker/check-image-labels.sh index "${IMAGE}:${VERSION}" "$VERSION" "$GITHUB_SHA" "$source_url"

          raw="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}")"
          lists() {
            local got
            got="$(jq -r --arg a "$1" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' <<<"$raw")"
            [ "$got" = "$2" ] || { echo "::error::${IMAGE}:${VERSION} lists linux/$1 as '${got}', not $2"; exit 1; }
          }
          lists amd64 "$amd64"
          lists arm64 "$arm64"
          index="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          for t in "${tags[@]}"; do
            d="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            [ "$d" = "$index" ] || { echo "::error::$t is ${d}, not ${index}"; exit 1; }
          done
          {
            echo "### Published ${IMAGE}:${VERSION}"
            echo ""
            echo "- manifest list: \`${index}\`"
            echo "- linux/amd64: \`${amd64}\`"
            echo "- linux/arm64: \`${arm64}\`"
            echo "- tags: ${tags[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${tags[*]} at ${index} (amd64 ${amd64}, arm64 ${arm64})"
