# CI for Platehouse (build plan Task 3).
#
# The workspace jobs run on every pull request and on every push to main and
# the release branches, whatever the change touches (issue #16: a paths filter
# on the triggers meant no CI ran on product PRs). They run in a chain:
# lint -> typecheck -> unit -> integration. Each test job fails when no test
# actually ran (AC-094), and logs how many did.
#
# The slicing gate job builds a large image, so it keeps its own path scoping:
# the changes job decides whether tools/slicing-gate, this file or .node-version
# (the gate job's Node version) changed, and the gate job runs only then. Nothing depends on the gate job, so its skip
# reaches no other job. Nothing is pushed anywhere and no secret is used. No
# designer file comes near any job: every test builds its own fixtures.
name: ci

on:
  pull_request:
  # Pushes only to the branches that take merges: a push to a PR branch is
  # already run by pull_request, and ran twice without this (issue #8).
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Decide which path-scoped jobs run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.diff.outputs.gate }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request is compared with its base commit, a push with the commit
      # the branch pointed at before it. With no usable base (a new branch, or
      # a force-push whose old commit is gone) the gate job runs, to be safe.
      - name: Decide whether the gate job runs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          gate=true
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${base:-none}); the gate job runs."
          else
            changed="$(git diff --name-only "$base" HEAD)"
            echo "Files changed since ${base}:"
            printf '%s\n' "$changed"
            if grep -Eq '^(tools/slicing-gate/|\.github/workflows/ci\.yml$|\.node-version$)' <<<"$changed"; then
              echo "The slicing gate, this workflow or .node-version changed; the gate job runs."
            else
              gate=false
              echo "Neither the slicing gate, this workflow nor .node-version changed; the gate job is skipped."
            fi
          fi
          echo "gate=${gate}" >>"$GITHUB_OUTPUT"

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    needs: lint
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: tsc -b
        run: pnpm exec tsc -b

  unit:
    name: Unit tests
    needs: typecheck
    if: ${{ !cancelled() && needs.typecheck.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The zero-test guard (AC-094). A test that a filter skipped still counts
      # in numTotalTests, so the guard counts the tests that ran: the total less
      # the skipped and todo ones. It runs even when vitest fails, so the count
      # is always logged, and then the step takes vitest's own exit code.
      - name: Unit tests
        run: |
          status=0
          pnpm exec vitest run --project unit --reporter=default --reporter=json --outputFile=report.json || status=$?
          if [ ! -s report.json ]; then
            echo "::error::No tests ran (vitest wrote no report, exit ${status})"
            exit 1
          fi
          total="$(jq '.numTotalTests' report.json)"
          skipped="$(jq '.numPendingTests + .numTodoTests' report.json)"
          ran=$((total - skipped))
          echo "unit: ${ran} tests ran, ${skipped} skipped, ${total} collected"
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests ran"
            exit 1
          fi
          exit "$status"
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration tests
    needs: unit
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Postgres and the S3 test server start through testcontainers on the
      # runner's Docker. Same zero-test guard as the unit job.
      - name: Integration tests
        run: |
          status=0
          pnpm exec vitest run --project integration --reporter=default --reporter=json --outputFile=report.json || status=$?
          if [ ! -s report.json ]; then
            echo "::error::No tests ran (vitest wrote no report, exit ${status})"
            exit 1
          fi
          total="$(jq '.numTotalTests' report.json)"
          skipped="$(jq '.numPendingTests + .numTodoTests' report.json)"
          ran=$((total - skipped))
          echo "integration: ${ran} tests ran, ${skipped} skipped, ${total} collected"
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests ran"
            exit 1
          fi
          exit "$status"
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 14

  # The slicing gate's tests and a build of the gate image, so an image build
  # failure is found here and not on Hades (the second Hades run, 2026-11-08,
  # failed while building the image). Runs only when the changes job says the
  # gate, this workflow or .node-version changed.
  gate-image:
    name: Slicing gate tests and image build
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: platehouse-gate:ci
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      # A green job must mean tests ran: the TAP copy of the results is read
      # for its test count, and a count of zero fails the step.
      - name: Gate tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=gate-tests.tap \
            'tools/slicing-gate/test/**/*.test.mjs'
          grep -E '^# (tests|pass|fail|skipped) ' gate-tests.tap
          if ! grep -Eq '^# tests [1-9][0-9]*$' gate-tests.tap; then
            echo "::error::No gate tests ran"
            exit 1
          fi

      # Every RUN step and build check in the Dockerfile runs here, as on Hades.
      - name: Build the gate image
        run: docker build --platform linux/amd64 -t "$IMAGE" tools/slicing-gate

      # Each check runs in a fresh container the way the gate runs on Hades:
      # no network, read-only root, a tmpfs scratch dir, no capabilities.
      # The last ones prove the two gate bugs of Hades run 3 (2026-11-08)
      # fixed: landrun's checks for report item (g), and a crafted cube saved
      # for one printer and sliced on the others. The cube is sliced twice:
      # with the image as built, and with Orca's process_full folder hidden by
      # an empty tmpfs, which is the image as it was for run 3 and must fail
      # the way run 3 did. Own-printer slices must match between the two.
      - name: Smoke-check the image
        run: |
          gate() {
            docker run --rm --network none --read-only \
              --tmpfs /work:rw,size=1g,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges:true -e HOME=/work \
              -v "$PWD/tools/slicing-gate:/src:ro" "$@"
          }
          smoke() {
            local name="$1"
            shift
            local out
            if ! out="$(gate "$IMAGE" "$@" 2>&1)"; then
              printf '%s\n' "$out"
              echo "::error::smoke check failed: ${name}"
              exit 1
            fi
            printf '== %s: ok\n' "${name}"
            # The first lines only, from a here-string: a pipe into head let
            # head close it early, and under pipefail the SIGPIPE that killed
            # printf failed a check that had passed (issue #9).
            head -n 8 <<<"$out"
          }
          smoke "orca --help exits 0" /opt/orca/AppRun --help
          smoke "BBL profile version" node /src/check-profile-version.mjs /opt/orca/resources/profiles/BBL.opc /opt/orca-profiles/BBL.json
          smoke "OrcaFilamentLibrary profile version" node /src/check-profile-version.mjs /opt/orca/resources/profiles/OrcaFilamentLibrary.opc /opt/orca-profiles/OrcaFilamentLibrary.json
          smoke "node starts" node --version
          smoke "openscad starts" /opt/openscad/AppRun --version
          smoke "landrun starts" landrun --version
          echo "== landrun checks, report item (g)"
          gate "$IMAGE" node /src/smoke-gate.mjs checks
          results="$RUNNER_TEMP/smoke"
          mkdir -p "$results"
          chmod 1777 "$results"
          echo "== crafted cube across printers, image as built"
          gate -v "$results:/results" "$IMAGE" node /src/smoke-gate.mjs switch --out /results/fixed.json
          echo "== crafted cube across printers, control: process_full hidden as in run 3"
          gate -v "$results:/results" --tmpfs /opt/orca/resources/profiles/BBL/process_full:ro,size=1m \
            "$IMAGE" node /src/smoke-gate.mjs switch --control --out /results/control.json
          echo "== own-printer slices with and without process_full"
          node tools/slicing-gate/smoke-gate.mjs compare "$results/fixed.json" "$results/control.json"
