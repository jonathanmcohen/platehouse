# CI for Platehouse (build plan Task 3).
#
# The workspace jobs run on every pull request and on every push to main and
# the release branches, whatever the change touches (issue #16: a paths filter
# on the triggers meant no CI ran on product PRs). They run in a chain:
# lint -> typecheck -> unit -> integration. Each test job fails when no test
# actually ran (AC-094), and logs how many did.
#
# The slicing gate job builds a large image, so it keeps its own path scoping:
# the changes job decides whether tools/slicing-gate, this file or .node-version
# (the gate job's Node version) changed, and the gate job runs only then. Nothing depends on the gate job, so its skip
# reaches no other job. The slicer job (build plan Task 11) is scoped the same
# way, by the same changes job: it builds the slicer image and runs the
# container tests against it, and nothing depends on it either. Nothing is
# pushed anywhere, no image is published (Task 25 does that) and no secret is
# used. No designer file comes near any job: every test builds its own
# fixtures, and the one outside file, the slicer's STEP sample, is public NIST
# test data checked against its sha256.
name: ci

on:
  pull_request:
  # Pushes only to the branches that take merges: a push to a PR branch is
  # already run by pull_request, and ran twice without this (issue #8).
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Decide which path-scoped jobs run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.diff.outputs.gate }}
      slicer: ${{ steps.slicer.outputs.slicer }}
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request is compared with its base commit, a push with the commit
      # the branch pointed at before it. With no usable base (a new branch, or
      # a force-push whose old commit is gone) the gate job runs, to be safe.
      # --no-renames lists both paths of a move: with rename detection on (git's
      # default) only the new path is listed, so a file moved out of the gate
      # would leave no gate path in the list and skip the job.
      - name: Decide whether the gate job runs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          gate=true
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${base:-none}); the gate job runs."
          else
            changed="$(git diff --name-only --no-renames "$base" HEAD)"
            echo "Files changed since ${base}:"
            printf '%s\n' "$changed"
            if grep -Eq '^(tools/slicing-gate/|\.github/workflows/ci\.yml$|\.node-version$)' <<<"$changed"; then
              echo "The slicing gate, this workflow or .node-version changed; the gate job runs."
            else
              gate=false
              echo "Neither the slicing gate, this workflow nor .node-version changed; the gate job is skipped."
            fi
          fi
          echo "gate=${gate}" >>"$GITHUB_OUTPUT"

      # The same rule for the slicer job (build plan Task 11), with the same
      # base commit and the same safe default. It runs when apps/slicer or
      # packages/slicer-contract changes, or anything else the slicer image or
      # its container tests are built from: packages/threemf (the slicer reads
      # projects with it, and buildSliceable lives there), the root workspace
      # files the image's install and build read, vitest.config.ts (the
      # container project), this workflow and .node-version.
      - name: Decide whether the slicer job runs
        id: slicer
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          slicer=true
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${base:-none}); the slicer job runs."
          else
            changed="$(git diff --name-only --no-renames "$base" HEAD)"
            if grep -Eq '^(apps/slicer/|packages/slicer-contract/|packages/threemf/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|vitest\.config\.ts$|\.github/workflows/ci\.yml$|\.node-version$)' <<<"$changed"; then
              echo "The slicer, its contract or an input of its image changed; the slicer job runs."
            else
              slicer=false
              echo "Nothing the slicer image is built from changed; the slicer job is skipped."
            fi
          fi
          echo "slicer=${slicer}" >>"$GITHUB_OUTPUT"

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    needs: lint
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: tsc -b
        run: pnpm exec tsc -b

  unit:
    name: Unit tests
    needs: typecheck
    if: ${{ !cancelled() && needs.typecheck.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The zero-test guard (AC-094). A test that a filter skipped still counts
      # in numTotalTests, so the guard counts the tests that ran: the total less
      # the skipped and todo ones. The count is logged whenever vitest wrote a
      # report, pass or fail. A failed vitest run then ends the step with
      # vitest's own exit code before the zero-test check, so "No tests ran"
      # means vitest passed with nothing run, never a hidden failure (#20).
      - name: Unit tests
        run: |
          status=0
          pnpm exec vitest run --project unit --reporter=default --reporter=json --outputFile=report.json || status=$?
          if [ -s report.json ]; then
            total="$(jq '.numTotalTests' report.json)"
            skipped="$(jq '.numPendingTests + .numTodoTests' report.json)"
            ran=$((total - skipped))
            echo "unit: ${ran} tests ran, ${skipped} skipped, ${total} collected"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Vitest failed (exit ${status}); its output above names the failure"
            exit "$status"
          fi
          if [ ! -s report.json ]; then
            echo "::error::No tests ran (vitest wrote no report)"
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests ran"
            exit 1
          fi
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration tests
    needs: unit
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Postgres and the S3 test server start through testcontainers on the
      # runner's Docker. Same zero-test guard as the unit job.
      - name: Integration tests
        run: |
          status=0
          pnpm exec vitest run --project integration --reporter=default --reporter=json --outputFile=report.json || status=$?
          if [ -s report.json ]; then
            total="$(jq '.numTotalTests' report.json)"
            skipped="$(jq '.numPendingTests + .numTodoTests' report.json)"
            ran=$((total - skipped))
            echo "integration: ${ran} tests ran, ${skipped} skipped, ${total} collected"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Vitest failed (exit ${status}); its output above names the failure"
            exit "$status"
          fi
          if [ ! -s report.json ]; then
            echo "::error::No tests ran (vitest wrote no report)"
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests ran"
            exit 1
          fi
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 14

  # The slicing gate's tests and a build of the gate image, so an image build
  # failure is found here and not on Hades (the second Hades run, 2026-11-08,
  # failed while building the image). Runs only when the changes job says the
  # gate, this workflow or .node-version changed.
  gate-image:
    name: Slicing gate tests and image build
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: platehouse-gate:ci
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      # A green job must mean tests ran: the TAP copy of the results is read
      # for its test count, and a count of zero fails the step.
      - name: Gate tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=gate-tests.tap \
            'tools/slicing-gate/test/**/*.test.mjs'
          grep -E '^# (tests|pass|fail|skipped) ' gate-tests.tap
          if ! grep -Eq '^# tests [1-9][0-9]*$' gate-tests.tap; then
            echo "::error::No gate tests ran"
            exit 1
          fi

      # Every RUN step and build check in the Dockerfile runs here, as on Hades.
      - name: Build the gate image
        run: docker build --platform linux/amd64 -t "$IMAGE" tools/slicing-gate

      # Each check runs in a fresh container the way the gate runs on Hades:
      # no network, read-only root, a tmpfs scratch dir, no capabilities.
      # The last ones prove the two gate bugs of Hades run 3 (2026-11-08)
      # fixed: landrun's checks for report item (g), and a crafted cube saved
      # for one printer and sliced on the others. The cube is sliced twice:
      # with the image as built, and with Orca's process_full folder hidden by
      # an empty tmpfs, which is the image as it was for run 3 and must fail
      # the way run 3 did. Own-printer slices must match between the two.
      - name: Smoke-check the image
        run: |
          gate() {
            docker run --rm --network none --read-only \
              --tmpfs /work:rw,size=1g,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges:true -e HOME=/work \
              -v "$PWD/tools/slicing-gate:/src:ro" "$@"
          }
          smoke() {
            local name="$1"
            shift
            local out
            if ! out="$(gate "$IMAGE" "$@" 2>&1)"; then
              printf '%s\n' "$out"
              echo "::error::smoke check failed: ${name}"
              exit 1
            fi
            printf '== %s: ok\n' "${name}"
            # The first lines only, from a here-string: a pipe into head let
            # head close it early, and under pipefail the SIGPIPE that killed
            # printf failed a check that had passed (issue #9).
            head -n 8 <<<"$out"
          }
          smoke "orca --help exits 0" /opt/orca/AppRun --help
          smoke "BBL profile version" node /src/check-profile-version.mjs /opt/orca/resources/profiles/BBL.opc /opt/orca-profiles/BBL.json
          smoke "OrcaFilamentLibrary profile version" node /src/check-profile-version.mjs /opt/orca/resources/profiles/OrcaFilamentLibrary.opc /opt/orca-profiles/OrcaFilamentLibrary.json
          smoke "node starts" node --version
          smoke "openscad starts" /opt/openscad/AppRun --version
          smoke "landrun starts" landrun --version
          echo "== landrun checks, report item (g)"
          gate "$IMAGE" node /src/smoke-gate.mjs checks
          results="$RUNNER_TEMP/smoke"
          mkdir -p "$results"
          chmod 1777 "$results"
          echo "== crafted cube across printers, image as built"
          gate -v "$results:/results" "$IMAGE" node /src/smoke-gate.mjs switch --out /results/fixed.json
          echo "== crafted cube across printers, control: process_full hidden as in run 3"
          gate -v "$results:/results" --tmpfs /opt/orca/resources/profiles/BBL/process_full:ro,size=1m \
            "$IMAGE" node /src/smoke-gate.mjs switch --control --out /results/control.json
          echo "== own-printer slices with and without process_full"
          node tools/slicing-gate/smoke-gate.mjs compare "$results/fixed.json" "$results/control.json"

  # The slicer image (build plan Task 11): the container tests build
  # apps/slicer/Dockerfile and run it the way Hades will (read-only root,
  # tmpfs /work, 4 CPUs, 4 GB, no capabilities), then test contract v1 over
  # HTTP: a real slice of buildSliceable's plates, OpenSCAD renders and the
  # landrun sandbox, STEP to GLB, health and the printer menu. Runs only when
  # the changes job says the slicer or an input of its image changed. The
  # image stays on the runner; nothing is pushed.
  slicer-image:
    name: Slicer image and container tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.slicer == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SLICER_IMAGE: platehouse-slicer:ci
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The STEP sample of gate item (h): NIST MBE PMI test case CTC-01,
      # geometry only (published 2024-06-19; NIST allows use without
      # restriction). The archive and the extracted file are both checked
      # against the sha256 values the slicing gate's Dockerfile records.
      - name: Fetch the STEP sample
        env:
          NIST_URL: https://www.nist.gov/system/files/documents/noindex/2024/06/19/NIST-PMI-STEP-Files.zip
          NIST_SHA256: 8fa78429e6d8d9b0d7681d223b6aa9ec98c3772185c55b1a0e3679b21c181911
          NIST_STEP_SHA256: e081d518484d5c708c6729353237f94a7d97da2b74a10d60d4c0d146d67a5855
        run: |
          dir="$RUNNER_TEMP/step"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/nist.zip" "$NIST_URL"
          echo "$NIST_SHA256  $dir/nist.zip" | sha256sum -c -
          unzip -j -q "$dir/nist.zip" 'NIST-PMI-STEP-Files/AP203 geometry only/nist_ctc_01_asme1_rd.stp' -d "$dir"
          echo "$NIST_STEP_SHA256  $dir/nist_ctc_01_asme1_rd.stp" | sha256sum -c -
          echo "STEP_SAMPLE=$dir/nist_ctc_01_asme1_rd.stp" >>"$GITHUB_ENV"
      # Same zero-test guard as the unit and integration jobs. The image is
      # built inside the run (the first file's beforeAll), so a build failure
      # fails the tests rather than skipping them.
      - name: Container tests
        run: |
          status=0
          pnpm exec vitest run --project container --reporter=default --reporter=json --outputFile=report.json || status=$?
          if [ -s report.json ]; then
            total="$(jq '.numTotalTests' report.json)"
            skipped="$(jq '.numPendingTests + .numTodoTests' report.json)"
            ran=$((total - skipped))
            echo "container: ${ran} tests ran, ${skipped} skipped, ${total} collected"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Vitest failed (exit ${status}); its output above names the failure"
            exit "$status"
          fi
          if [ ! -s report.json ]; then
            echo "::error::No tests ran (vitest wrote no report)"
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "::error::No tests ran"
            exit 1
          fi
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: container-report
          path: report.json
          if-no-files-found: ignore
          retention-days: 14

  # The app image (build plan Task 24; this job approved by Jon 2026-11-13):
  # docker/app.Dockerfile, built natively for amd64 and arm64 on every run,
  # then run by docker/test-app-image.sh against Postgres 17 and the S3 test
  # server on a private Docker network. The container's own HEALTHCHECK must
  # report healthy, /healthz answer 200, and every migration the image ships
  # beside the built migrate.js be applied (#31). Then the same image with
  # apps/web/dist removed must keep running with /healthz 503 and its
  # HEALTHCHECK reporting unhealthy (#162). Nothing is pushed and there is no
  # login anywhere: the images stay on the runner. Nothing depends on this
  # job.
  app-image:
    name: App image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: platehouse:ci
      NO_WEB_IMAGE: platehouse:ci-no-web
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=app-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-image-${{ matrix.arch }}
      - name: Run the image and check it reports healthy
        run: docker/test-app-image.sh "$IMAGE" healthy
      # The image above with only apps/web/dist taken out. It is built with
      # Docker's own builder (the default one), which sees the image just
      # loaded; the Buildx builder above would try to pull it instead.
      - name: Build the same image without the web app
        run: |
          docker buildx build --builder default --load -t "$NO_WEB_IMAGE" --build-arg "IMAGE=$IMAGE" - <<'DOCKERFILE'
          ARG IMAGE
          FROM ${IMAGE}
          USER root
          RUN rm -rf /app/apps/web/dist && test ! -e /app/apps/web/dist
          USER node
          DOCKERFILE
      - name: Run it and check it reports unhealthy
        run: docker/test-app-image.sh "$NO_WEB_IMAGE" unhealthy
